name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/peer-ci
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "$bin" || true
          else
            strip "$bin" || true
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=peer-ci
          version=${GITHUB_REF_NAME}
          dist=${name}-${version}-${{ matrix.target }}

          mkdir -p dist/${dist}
          cp target/${{ matrix.target }}/release/${name} dist/${dist}/

          tar -C dist -czf dist/${dist}.tar.gz ${dist}
          sha256sum dist/${dist}.tar.gz > dist/${dist}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: peer-ci-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.sha256
          generate_release_notes: true
