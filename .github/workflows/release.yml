name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set target triple
        shell: bash
        run: echo "TARGET=${{ matrix.arch }}-unknown-linux-gnu" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }}

      - name: Strip
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ env.TARGET }}/release/peer-ci
          strip "$bin" || true

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=peer-ci
          version=${GITHUB_REF_NAME}
          dist=${name}-${version}-${{ env.TARGET }}

          mkdir -p dist/${dist}
          cp target/${{ env.TARGET }}/release/${name} dist/${dist}/

          tar -C dist -czf dist/${dist}.tar.gz ${dist}
          sha256sum dist/${dist}.tar.gz > dist/${dist}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: peer-ci-${{ env.TARGET }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.sha256
          generate_release_notes: true
