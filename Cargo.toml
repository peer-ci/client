[package]
name = "peer-ci"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "io-util", "io-std", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
